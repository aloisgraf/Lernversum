# Sicherheit: Pakete erst installieren, wenn die Version mindestens 14 Tage alt ist
# (Schutz vor kompromittierten Neuveröffentlichungen). Angabe in Minuten.
minimumReleaseAge: 20160
onlyBuiltDependencies:
  - esbuild
  - sharp
  - supabase
  - unrs-resolver
# Ausnahme für Sicherheitsupdates (D-020): Next.js 16.4.2 behebt kritische Lücken
# (GHSA-2464-fhr4-w9xw, GHSA-673q-mjm6-r5xr, GHSA-p3m5-59mp-jv5r) und ist jünger als 14 Tage.
# Nach dem 2026-10-29 wieder entfernen.
minimumReleaseAgeExclude:
  - next
  - "@next/*"
  - eslint-config-next
